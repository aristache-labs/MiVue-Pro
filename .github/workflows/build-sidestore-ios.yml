name: Build iOS for SideStore

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Build name/version'
        required: false
        default: 'manual-build'

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Setup Expo
        run: npm install -g eas-cli
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Prebuild iOS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo prebuild --clean --platform ios

      - name: Build iOS IPA
        run: |
          cd ios
          xcodebuild -workspace Laneory.xcworkspace \
            -scheme Laneory \
            -configuration Release \
            -derivedDataPath build \
            -arch arm64 \
            -sdk iphoneos \
            OTHER_CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO || true

      - name: Check build artifacts
        run: |
          echo "Looking for build artifacts..."
          find ios/build -name "*.app" -type d || echo "No .app found"
          find . -name "Laneory*" -o -name "*.ipa" 2>/dev/null || echo "No IPA found"

      - name: Create IPA from build
        run: |
          APP_PATH="ios/build/Build/Products/Release-iphoneos/Laneory.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r Laneory-unsigned.ipa Payload/
            ls -lh Laneory-unsigned.ipa
          else
            echo "App not found at $APP_PATH"
            exit 1
          fi
        working-directory: mobile

      - name: Upload IPA to artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Laneory-iOS-unsigned-${{ github.run_number }}
          path: mobile/Laneory-unsigned.ipa
          retention-days: 7

      - name: Build summary
        if: success()
        run: |
          echo "✅ Build completed successfully!"
          echo ""
          echo "📥 Download the .ipa from:"
          echo "   GitHub → Actions → workflow run → Artifacts"
          echo ""
          echo "📱 Next steps:"
          echo "   1. Download Laneory-iOS-unsigned-${{ github.run_number }}.ipa"
          echo "   2. Open SideStore on your iOS device"
          echo "   3. Tap '+' to add app"
          echo "   4. Select the downloaded .ipa"
          echo "   5. SideStore signs and installs"
