name: Build iOS for SideStore

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Build name/version'
        required: false
        default: 'manual-build'

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Setup Expo
        run: npm install -g eas-cli
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Prebuild iOS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo prebuild --clean --platform ios

      - name: Build iOS IPA
        run: |
          cd ios
          xcodebuild -workspace Laneory.xcworkspace \
            -scheme Laneory \
            -configuration Release \
            -derivedDataPath build \
            -arch arm64 \
            -sdk iphoneos \
            OTHER_CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA from build
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/Laneory.app Payload/
          zip -r ../Laneory-unsigned.ipa Payload/
          rm -rf Payload

      - name: Upload IPA to artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Laneory-iOS-unsigned-${{ github.run_number }}
          path: mobile/Laneory-unsigned.ipa
          retention-days: 7

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: iOS Build ${{ github.run_number }}
          body: |
            Built for SideStore sideloading
            
            **NOTE:** This is an UNSIGNED .ipa
            Use SideStore to sign and install on your device.
            
            Run: ${{ github.run_number }}
            Trigger: ${{ github.event_name }}
          draft: false
          prerelease: true
          files: |
            mobile/Laneory-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
